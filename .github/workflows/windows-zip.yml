name: windows-zip

# Build the self-contained Windows bundle: plugin + CLI + body profiles
# + double-click/drag-drop installer, as a Release asset. Every push to
# main updates the workflow artifact; a v* tag attaches it to a release.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout CLI repo (profiles + renderer)
        uses: actions/checkout@v4
        with:
          repository: AaronyfDesign/see-through-camera
          path: see-through-camera

      - name: Stage bundle
        run: |
          mkdir -p dist/SeeThroughCamera-windows/cli
          cp -R src/SeeThroughCamera.lrplugin dist/SeeThroughCamera-windows/
          cp see-through-camera/cli/watermark.py dist/SeeThroughCamera-windows/cli/
          cp -R see-through-camera/body_profiles dist/SeeThroughCamera-windows/
          cp scripts/install.ps1 scripts/install.cmd dist/SeeThroughCamera-windows/
          cp README.zh-CN.md dist/SeeThroughCamera-windows/使用说明.md
          cd dist && zip -r ../SeeThroughCamera-windows.zip SeeThroughCamera-windows

      - name: Upload artifact (every run)
        uses: actions/upload-artifact@v4
        with:
          name: SeeThroughCamera-windows
          path: SeeThroughCamera-windows.zip

      - name: Attach to release (v* tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: SeeThroughCamera-windows.zip
